<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Facts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div class="page">

  <!-- Resume dialog (shown if a saved draft exists) -->
  <div id="resume-dialog" class="modal-backdrop" style="display:none;">
    <div class="modal-box">
      <div style="font-size:2.5rem; margin-bottom:12px;">💾</div>
      <h2 style="margin-bottom:8px;">Saved Game Found</h2>
      <p id="resume-subtitle" style="color:var(--color-muted); margin-bottom:24px;"></p>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <button class="btn-primary" id="resume-btn">▶ Resume</button>
        <button class="btn-secondary" id="fresh-btn">↺ Start Fresh</button>
      </div>
    </div>
  </div>

  <!-- Session view -->
  <div id="session-view" class="session-container">
    <div class="page-header" style="margin-bottom: 0; position: relative;">
      <div id="session-avatar"></div>
      <h1 id="session-user" style="font-size:1.4rem;"></h1>
      <button class="quit-btn" id="quit-btn" title="Save &amp; Quit">💾 Save &amp; Quit</button>
    </div>

    <div class="score-row">
      <span id="score-display">0 / 0 correct on first try</span>
      <span id="streak-display" class="streak-badge" style="display:none;">🔥 <span id="streak-count">0</span></span>
      <span id="cards-left"></span>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>

    <div class="flash-card card">
      <div class="flash-problem" id="problem-display"></div>
      <div class="correct-answer-reveal" id="correct-answer-reveal"></div>
    </div>

    <div class="answer-row">
      <input
        type="number"
        id="answer-input"
        class="answer-input"
        inputmode="numeric"
        pattern="[0-9]*"
        placeholder="?"
        autocomplete="off"
        min="0"
        max="999"
      >
      <button class="submit-btn" id="submit-btn">Check ✓</button>
    </div>
  </div>

  <!-- End screen (hidden until session complete) -->
  <div id="end-screen" class="end-screen" style="display:none;">
    <div class="confetti-emoji" id="end-emoji">🌟</div>
    <h2 style="font-size: 2rem;">You finished!</h2>
    <p class="end-score" id="end-message"></p>
    <p style="font-size: 2rem; font-weight: 800;" id="end-pct"></p>
    <div class="end-actions">
      <button class="btn-primary" id="play-again-btn">▶ Play Again</button>
      <button class="btn-secondary" id="stats-btn-end">📊 My Stats</button>
      <button class="btn-secondary" id="home-btn">🏠 Home</button>
    </div>
  </div>

</div>

<div class="feedback-overlay" id="feedback-overlay"></div>

<script src="js/api.js"></script>
<script src="js/avatar.js"></script>
<script src="js/deck.js"></script>
<script src="js/sound.js"></script>
<script src="js/session.js"></script>
</body>
</html>
