<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launch Flash Facts</title>
  <style>
    /* === CHANGE THIS TO YOUR NAS IP ADDRESS === */
    /* See the FLASH_FACTS_URL variable in the script below */

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #e8eaff 0%, #f5f0ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .launcher {
      text-align: center;
      padding: 48px 40px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 8px 40px rgba(91, 106, 245, 0.18);
      max-width: 400px;
      width: 90%;
    }

    .art {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      color: #5b6af5;
      margin-bottom: 8px;
    }

    .tagline {
      color: #7a7a9a;
      font-size: 1rem;
      margin-bottom: 32px;
    }

    .launch-btn {
      display: inline-block;
      background: #5b6af5;
      color: #fff;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 16px 48px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(91, 106, 245, 0.35);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .launch-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(91, 106, 245, 0.45);
    }

    .launch-btn:active {
      transform: scale(0.97);
    }

    .countdown {
      margin-top: 20px;
      color: #aaa;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
<div class="launcher">

  <!-- Fun math-themed SVG art (embedded, no external dependencies) -->
  <div class="art">
    <svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Background circle -->
      <circle cx="80" cy="80" r="76" fill="#eef0ff" stroke="#5b6af5" stroke-width="4"/>

      <!-- Lightning bolt (⚡ stylized) -->
      <path d="M90 22 L60 82 L78 82 L70 138 L110 68 L90 68 Z"
            fill="#5b6af5" opacity="0.15"/>
      <path d="M88 28 L62 80 L80 80 L72 132 L106 72 L88 72 Z"
            fill="#5b6af5"/>

      <!-- Math symbols scattered around -->
      <!-- Plus top-left -->
      <rect x="18" y="36" width="18" height="5" rx="2.5" fill="#ff7043"/>
      <rect x="24" y="30" width="5" height="18" rx="2.5" fill="#ff7043"/>

      <!-- Minus top-right -->
      <rect x="122" y="38" width="18" height="5" rx="2.5" fill="#43a047"/>

      <!-- × bottom-left -->
      <line x1="20" y1="110" x2="34" y2="124" stroke="#ab47bc" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="34" y1="110" x2="20" y2="124" stroke="#ab47bc" stroke-width="4.5" stroke-linecap="round"/>

      <!-- ÷ bottom-right -->
      <rect x="122" y="116" width="18" height="5" rx="2.5" fill="#e91e63"/>
      <circle cx="131" cy="109" r="3.5" fill="#e91e63"/>
      <circle cx="131" cy="126" r="3.5" fill="#e91e63"/>

      <!-- Stars -->
      <text x="130" y="52" font-size="14" fill="#ffc107">★</text>
      <text x="16" y="68" font-size="11" fill="#ffc107">★</text>
      <text x="126" y="102" font-size="10" fill="#ffc107">✦</text>
    </svg>
  </div>

  <h1>Flash Facts</h1>
  <p class="tagline">Math practice for superstar students!</p>

  <a id="launch-link" class="launch-btn" href="#">🚀 Launch</a>
  <p class="countdown" id="countdown">Connecting to Flash Facts...</p>

</div>

<script>
  // ================================================================
  // CHANGE THIS URL TO YOUR NAS IP ADDRESS AND PORT
  // Example: 'http://192.168.1.100:5000'
  // ================================================================
  var FLASH_FACTS_URL = 'http://nas.local:8090';
  // ================================================================

  document.getElementById('launch-link').href = FLASH_FACTS_URL;

  var seconds = 2;
  var el = document.getElementById('countdown');

  function tick() {
    if (seconds <= 0) {
      el.textContent = 'Launching...';
      window.location.href = FLASH_FACTS_URL;
    } else {
      el.textContent = 'Auto-launching in ' + seconds + ' second' + (seconds !== 1 ? 's' : '') + '…';
      seconds--;
      setTimeout(tick, 1000);
    }
  }

  tick();
</script>
</body>
</html>
